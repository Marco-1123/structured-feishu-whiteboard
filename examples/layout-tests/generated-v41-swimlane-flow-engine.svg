<text x="138" y="328" font-size="27" fill="#172033" font-weight="700"><tspan x="138" dy="0">泳道流程适合表达多角色协作：重点不是步骤数量，而是谁负责、交付什么、何时进入下一方。</tspan></text><rect x="96" y="424" width="2008" height="222" rx="14" fill="#FFFFFF" stroke="#D8E6F3" stroke-width="1" data-flow-lane="user"/>
