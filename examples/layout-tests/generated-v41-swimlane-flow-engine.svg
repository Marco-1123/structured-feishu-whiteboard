<text x="96" y="86" font-size="46" fill="#172033" font-weight="700"><tspan x="96" dy="0">飞书文档到画板生成流程</tspan></text>
<text x="96" y="144" font-size="21" fill="#5C6B82" font-weight="500"><tspan x="96" dy="0">把用户、Agent、渲染器和飞书文档的责任边界分清楚。</tspan></text><rect x="96" y="240" width="2008" height="128" rx="16" fill="#FFFFFF" stroke="#D8E6F3" stroke-width="1.5"/>
