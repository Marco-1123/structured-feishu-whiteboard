<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="804" viewBox="0 0 2200 804" data-layout-engine="v4" data-layout="flow-canvas" data-flow-mode="linear-flow">
<rect x="0" y="0" width="2200" height="804" rx="0" fill="#F7F8FA" stroke="#F7F8FA" stroke-width="0"/>
<g>
<text x="96" y="86" font-size="46" fill="#111827" font-weight="700"><tspan x="96" dy="0">Agent 任务执行链路</tspan></text>
<text x="96" y="144" font-size="21" fill="#5F6B7A" font-weight="500"><tspan x="96" dy="0">从目标输入到复盘沉淀的稳定执行流程。</tspan></text><rect x="96" y="240" width="2008" height="128" rx="16" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5"/>
<rect x="96" y="240" width="12" height="128" rx="6" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<text x="138" y="284" font-size="17" fill="#5E6AD2" font-weight="700"><tspan x="138" dy="0">流程判断</tspan></text>
<text x="138" y="328" font-size="27" fill="#111827" font-weight="700"><tspan x="138" dy="0">流程图适合表达强依赖步骤：每一步必须知道输入、动作、输出和下一步责任。</tspan></text><rect x="96" y="424" width="374" height="178" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="goal"/>
<rect x="118" y="446" width="8" height="134" rx="4" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<rect x="142" y="446" width="86" height="30" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
<text x="160" y="467" font-size="15" fill="#5E6AD2" font-weight="700"><tspan x="160" dy="0">开始</tspan></text>
<text x="142" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="142" dy="0">目标输入</tspan></text>
<text x="142" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="142" dy="0">明确任务边界</tspan><tspan x="142" dy="24">补齐约束条件</tspan></text>
<rect x="504" y="424" width="374" height="178" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="plan"/>
<rect x="526" y="446" width="8" height="134" rx="4" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<rect x="550" y="446" width="86" height="30" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
<text x="568" y="467" font-size="15" fill="#5E6AD2" font-weight="700"><tspan x="568" dy="0">动作</tspan></text>
<text x="550" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="550" dy="0">计划拆解</tspan></text>
<text x="550" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="550" dy="0">判断版式与容量</tspan><tspan x="550" dy="24">生成执行路径</tspan></text>
<rect x="912" y="424" width="374" height="178" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="render"/>
<rect x="934" y="446" width="8" height="134" rx="4" fill="#5F6B7A" stroke="#5F6B7A" stroke-width="1"/>
<rect x="958" y="446" width="86" height="30" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
<text x="976" y="467" font-size="15" fill="#5F6B7A" font-weight="700"><tspan x="976" dy="0">系统</tspan></text>
<text x="958" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="958" dy="0">确定渲染</tspan></text>
<text x="958" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="958" dy="0">生成 JSON brief</tspan><tspan x="958" dy="24">调用稳定渲染器</tspan></text>
<rect x="1320" y="424" width="374" height="178" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="check"/>
<rect x="1342" y="446" width="8" height="134" rx="4" fill="#8A5A44" stroke="#8A5A44" stroke-width="1"/>
<rect x="1366" y="446" width="86" height="30" rx="8" fill="#FFF7ED" stroke="#D8DEE8" stroke-width="1"/>
<text x="1384" y="467" font-size="15" fill="#8A5A44" font-weight="700"><tspan x="1384" dy="0">判断</tspan></text>
<text x="1366" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="1366" dy="0">质量检查</tspan></text>
<text x="1366" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="1366" dy="0">检查溢出重叠</tspan><tspan x="1366" dy="24">确认箭头连接</tspan></text>
<rect x="1728" y="424" width="374" height="178" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="deliver"/>
<rect x="1750" y="446" width="8" height="134" rx="4" fill="#16A085" stroke="#16A085" stroke-width="1"/>
<rect x="1774" y="446" width="86" height="30" rx="8" fill="#ECFDF5" stroke="#D8DEE8" stroke-width="1"/>
<text x="1792" y="467" font-size="15" fill="#16A085" font-weight="700"><tspan x="1792" dy="0">结果</tspan></text>
<text x="1774" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="1774" dy="0">写入飞书</tspan></text>
<text x="1774" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="1774" dy="0">插入可编辑画板</tspan><tspan x="1774" dy="24">返回链接预览</tspan></text>
<line x1="470" y1="513" x2="504" y2="513" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="goal-&gt;plan" data-from="goal" data-to="plan" data-start="470,513" data-end="504,513"/>
<line x1="504" y1="513" x2="492" y2="504" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="504" y1="513" x2="492" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/>
<line x1="878" y1="513" x2="912" y2="513" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="plan-&gt;render" data-from="plan" data-to="render" data-start="878,513" data-end="912,513"/>
<line x1="912" y1="513" x2="900" y2="504" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="912" y1="513" x2="900" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/>
<line x1="1286" y1="513" x2="1320" y2="513" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="render-&gt;check" data-from="render" data-to="check" data-start="1286,513" data-end="1320,513"/>
<line x1="1320" y1="513" x2="1308" y2="504" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="1320" y1="513" x2="1308" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/>
<line x1="1694" y1="513" x2="1728" y2="513" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="check-&gt;deliver" data-from="check" data-to="deliver" data-start="1694,513" data-end="1728,513"/>
<line x1="1728" y1="513" x2="1716" y2="504" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="1728" y1="513" x2="1716" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><rect x="96" y="658" width="2008" height="74" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.3"/>
<rect x="96" y="658" width="10" height="74" rx="5" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<text x="132" y="704" font-size="20" fill="#111827" font-weight="700"><tspan x="132" dy="0">适合 SOP、工程执行链路、工具调用链路和线性业务流程。</tspan></text>
</g>
