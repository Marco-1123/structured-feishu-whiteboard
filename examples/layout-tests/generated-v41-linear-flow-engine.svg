<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1158" viewBox="0 0 2200 1158" data-layout-engine="v4" data-layout="flow-canvas" data-flow-mode="linear-flow">
<rect x="0" y="0" width="2200" height="1158" rx="0" fill="#F7F8FA" stroke="#F7F8FA" stroke-width="0"/>
<g>
<text x="96" y="86" font-size="46" fill="#111827" font-weight="700"><tspan x="96" dy="0">Agent 任务执行链路</tspan></text>
<text x="96" y="144" font-size="21" fill="#5F6B7A" font-weight="500"><tspan x="96" dy="0">从目标输入到复盘沉淀的稳定执行流程。</tspan></text><rect x="96" y="240" width="2008" height="128" rx="16" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5"/>
<rect x="96" y="240" width="12" height="128" rx="6" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<text x="138" y="284" font-size="17" fill="#5E6AD2" font-weight="700"><tspan x="138" dy="0">流程判断</tspan></text>
<text x="138" y="328" font-size="27" fill="#111827" font-weight="700"><tspan x="138" dy="0">流程图适合表达强依赖步骤：每一步必须知道输入、动作、输出和下一步责任。</tspan></text><rect x="96" y="424" width="472" height="214" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="goal"/>
<rect x="118" y="446" width="8" height="170" rx="4" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<rect x="142" y="446" width="86" height="30" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
<text x="160" y="467" font-size="15" fill="#5E6AD2" font-weight="700"><tspan x="160" dy="0">开始</tspan></text>
<text x="142" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="142" dy="0">目标输入</tspan></text>
<text x="142" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="142" dy="0">明确任务边界</tspan><tspan x="142" dy="24">补齐约束条件</tspan></text>
<rect x="608" y="424" width="472" height="214" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="plan"/>
<rect x="630" y="446" width="8" height="170" rx="4" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<rect x="654" y="446" width="86" height="30" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
<text x="672" y="467" font-size="15" fill="#5E6AD2" font-weight="700"><tspan x="672" dy="0">动作</tspan></text>
<text x="654" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="654" dy="0">计划拆解</tspan></text>
<text x="654" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="654" dy="0">判断版式与容量</tspan><tspan x="654" dy="24">生成执行路径</tspan></text>
<rect x="1120" y="424" width="472" height="214" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="render"/>
<rect x="1142" y="446" width="8" height="170" rx="4" fill="#5F6B7A" stroke="#5F6B7A" stroke-width="1"/>
<rect x="1166" y="446" width="86" height="30" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
<text x="1184" y="467" font-size="15" fill="#5F6B7A" font-weight="700"><tspan x="1184" dy="0">系统</tspan></text>
<text x="1166" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="1166" dy="0">确定渲染</tspan></text>
<text x="1166" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="1166" dy="0">生成 JSON brief</tspan><tspan x="1166" dy="24">调用稳定渲染器</tspan></text>
<rect x="1632" y="424" width="472" height="214" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="check"/>
<rect x="1654" y="446" width="8" height="170" rx="4" fill="#8A5A44" stroke="#8A5A44" stroke-width="1"/>
<rect x="1678" y="446" width="86" height="30" rx="8" fill="#FFF7ED" stroke="#D8DEE8" stroke-width="1"/>
<text x="1696" y="467" font-size="15" fill="#8A5A44" font-weight="700"><tspan x="1696" dy="0">判断</tspan></text>
<text x="1678" y="508" font-size="24" fill="#111827" font-weight="700"><tspan x="1678" dy="0">质量检查</tspan></text>
<text x="1678" y="540" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="1678" dy="0">检查溢出重叠</tspan><tspan x="1678" dy="24">确认箭头连接</tspan></text>
<rect x="96" y="742" width="472" height="214" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5" data-flow-node="deliver"/>
<rect x="118" y="764" width="8" height="170" rx="4" fill="#16A085" stroke="#16A085" stroke-width="1"/>
<rect x="142" y="764" width="86" height="30" rx="8" fill="#ECFDF5" stroke="#D8DEE8" stroke-width="1"/>
<text x="160" y="785" font-size="15" fill="#16A085" font-weight="700"><tspan x="160" dy="0">结果</tspan></text>
<text x="142" y="826" font-size="24" fill="#111827" font-weight="700"><tspan x="142" dy="0">写入飞书</tspan></text>
<text x="142" y="858" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="142" dy="0">插入可编辑画板</tspan><tspan x="142" dy="24">返回链接预览</tspan></text>
<line x1="568" y1="531" x2="608" y2="531" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="goal-&gt;plan" data-from="goal" data-to="plan" data-start="568,531" data-end="608,531"/>
<line x1="608" y1="531" x2="596" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="608" y1="531" x2="596" y2="540" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/>
<line x1="1080" y1="531" x2="1120" y2="531" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="plan-&gt;render" data-from="plan" data-to="render" data-start="1080,531" data-end="1120,531"/>
<line x1="1120" y1="531" x2="1108" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="1120" y1="531" x2="1108" y2="540" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/>
<line x1="1592" y1="531" x2="1632" y2="531" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" data-flow-edge="render-&gt;check" data-from="render" data-to="check" data-start="1592,531" data-end="1632,531"/>
<line x1="1632" y1="531" x2="1620" y2="522" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="1632" y1="531" x2="1620" y2="540" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/>
<polyline points="2104,531 1100,531 1100,849 96,849" fill="none" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" data-flow-edge="check-&gt;deliver" data-from="check" data-to="deliver" data-start="2104,531" data-end="96,849"/>
<line x1="96" y1="849" x2="108" y2="840" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><line x1="96" y1="849" x2="108" y2="858" stroke="#5E6AD2" stroke-width="3" stroke-linecap="round"/><rect x="96" y="1012" width="2008" height="74" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.3"/>
<rect x="96" y="1012" width="10" height="74" rx="5" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<text x="132" y="1058" font-size="20" fill="#111827" font-weight="700"><tspan x="132" dy="0">适合 SOP、工程执行链路、工具调用链路和线性业务流程。</tspan></text>
</g>
</svg>