<text x="148" y="596" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="148" dy="0">经验沉淀分散，Agent 难以持续复用。</tspan></text><text x="599" y="614" font-size="38" fill="#5E6AD2" font-weight="700"><tspan x="599" dy="0">→</tspan></text>
