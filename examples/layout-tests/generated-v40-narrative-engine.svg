<g data-v43-block="title" data-block-type="title" data-x="96" data-y="40" data-width="2008" data-height="170" data-column="full">
<text x="96" y="86" font-size="46" fill="#111827" font-weight="700"><tspan x="96" dy="0">V4 决策路径地图</tspan></text>
<text x="96" y="144" font-size="21" fill="#5F6B7A" font-weight="500"><tspan x="96" dy="0">把问题、约束、证据、风险和动作放在同一条论证链上。</tspan></text>
</g><g data-v43-block="statement" data-block-type="statement" data-x="96" data-y="210" data-width="2008" data-height="150" data-column="full">
