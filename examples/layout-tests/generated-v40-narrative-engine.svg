<text x="1484" y="848" font-size="26" fill="#111827" font-weight="700"><tspan x="1484" dy="0">主要风险</tspan></text>
<text x="1484" y="880" font-size="18" fill="#5F6B7A" font-weight="500"><tspan x="1484" dy="0">避免记录了但没有被使用</tspan></text>
<rect x="1484" y="911" width="592" height="54" rx="10" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.2" data-v4-risk-item="0"/>
