<text x="642" y="596" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="642" dy="0">既要长期可读，也要进入执行链路。</tspan></text><text x="1093" y="614" font-size="38" fill="#5E6AD2" font-weight="700"><tspan x="1093" dy="0">→</tspan></text>
