<text x="124" y="848" font-size="26" fill="#111827" font-weight="700"><tspan x="124" dy="0">决策矩阵</tspan></text>
<text x="124" y="880" font-size="18" fill="#5F6B7A" font-weight="500"><tspan x="124" dy="0">用明确维度减少主观争论</tspan></text><rect x="124" y="898" width="1952" height="42" rx="8" fill="#F1F3F6" stroke="#D8DEE8" stroke-width="1"/>
