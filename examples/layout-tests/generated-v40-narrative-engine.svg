<text x="865.76" y="925" font-size="15" fill="#5F6B7A" font-weight="700"><tspan x="865.76" dy="0">判断依据</tspan></text>
<text x="1966" y="925" font-size="15" fill="#5F6B7A" font-weight="700"><tspan x="1966" dy="0">结论</tspan></text>
<rect x="124" y="940" width="1952" height="48" rx="8" fill="#ECEEFE" stroke="#5E6AD2" stroke-width="1.3"/>
<text x="144" y="971" font-size="17" fill="#5E6AD2" font-weight="700"><tspan x="144" dy="0">LLM Wiki</tspan></text>
<text x="865.76" y="971" font-size="15" fill="#5F6B7A" font-weight="500"><tspan x="865.76" dy="0">沉淀能力强</tspan></text>
<text x="1966" y="971" font-size="16" fill="#16A085" font-weight="700"><tspan x="1966" dy="0">推荐</tspan></text>
<rect x="124" y="996" width="1952" height="48" rx="8" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.3"/>
<text x="144" y="1027" font-size="17" fill="#111827" font-weight="700"><tspan x="144" dy="0">飞书文档</tspan></text>
<text x="865.76" y="1027" font-size="15" fill="#5F6B7A" font-weight="500"><tspan x="865.76" dy="0">适合人工阅读</tspan></text>
<text x="1966" y="1027" font-size="16" fill="#5E6AD2" font-weight="700"><tspan x="1966" dy="0">展示</tspan></text>
<rect x="124" y="1052" width="1952" height="48" rx="8" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.3"/>
<text x="144" y="1083" font-size="17" fill="#111827" font-weight="700"><tspan x="144" dy="0">聊天记录</tspan></text>
<text x="865.76" y="1083" font-size="15" fill="#5F6B7A" font-weight="500"><tspan x="865.76" dy="0">复用成本高</tspan></text>
<text x="1966" y="1083" font-size="16" fill="#8A5A44" font-weight="700"><tspan x="1966" dy="0">不推荐</tspan></text>
