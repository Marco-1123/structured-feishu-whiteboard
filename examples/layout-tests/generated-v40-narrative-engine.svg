<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1680" viewBox="0 0 2200 1680" data-layout-engine="v4" data-expression-mode="narrative-map">
<rect x="0" y="0" width="2200" height="1680" rx="0" fill="#F7F8FA" stroke="#F7F8FA" stroke-width="0"/>
<g>
<g data-v43-block="title" data-block-type="title" data-x="96" data-y="40" data-width="2008" data-height="200" data-column="full">
<text x="96" y="86" font-size="46" fill="#111827" font-weight="700"><tspan x="96" dy="0">V4 决策路径地图</tspan></text>
<text x="96" y="144" font-size="21" fill="#5F6B7A" font-weight="500"><tspan x="96" dy="0">把问题、约束、证据、风险和动作放在同一条论证链上。</tspan></text>
</g><g data-v43-block="statement" data-block-type="statement" data-x="96" data-y="240" data-width="2008" data-height="150" data-column="full">
<rect x="96" y="240" width="2008" height="150" rx="16" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5"/>
<rect x="96" y="240" width="12" height="150" rx="6" fill="#5E6AD2" stroke="#5E6AD2" stroke-width="1"/>
<text x="138" y="288" font-size="18" fill="#5E6AD2" font-weight="700"><tspan x="138" dy="0">主判断</tspan></text>
<text x="138" y="338" font-size="31" fill="#111827" font-weight="700"><tspan x="138" dy="0">原则进 Wiki，规则进 Skill，案例进文档。</tspan></text>
</g><g data-v43-block="narrative-chain-1" data-block-type="narrative-chain" data-x="96" data-y="434" data-width="2008" data-height="334" data-column="full" data-row="0" data-span="12" data-density="medium" data-preferred-width="2008" data-text-units="95" data-item-count="4" data-item-layout="rows" data-layout-reason="directional-reading">
<rect x="96" y="434" width="2008" height="334" rx="16" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.5"/>
<text x="124" y="482" font-size="26" fill="#111827" font-weight="700"><tspan x="124" dy="0">判断路径</tspan></text>
<text x="124" y="514" font-size="18" fill="#5F6B7A" font-weight="500"><tspan x="124" dy="0">从问题到落地选择</tspan></text>
<rect x="124" y="544" width="468" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.4"/>
<text x="148" y="590" font-size="24" fill="#111827" font-weight="700"><tspan x="148" dy="0">问题</tspan></text>
<text x="148" y="626" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="148" dy="0">经验沉淀分散，Agent 难以持续复用。</tspan></text><text x="599" y="644" font-size="38" fill="#5E6AD2" font-weight="700"><tspan x="599" dy="0">→</tspan></text>
<rect x="618" y="544" width="468" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.4"/>
<text x="642" y="590" font-size="24" fill="#111827" font-weight="700"><tspan x="642" dy="0">约束</tspan></text>
<text x="642" y="626" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="642" dy="0">既要长期可读，也要进入执行链路。</tspan></text><text x="1093" y="644" font-size="38" fill="#5E6AD2" font-weight="700"><tspan x="1093" dy="0">→</tspan></text>
<rect x="1112" y="544" width="468" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.4"/>
<text x="1136" y="590" font-size="24" fill="#111827" font-weight="700"><tspan x="1136" dy="0">选择</tspan></text>
<text x="1136" y="626" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="1136" dy="0">稳定原则、执行规则和展示材料分开。</tspan></text><text x="1587" y="644" font-size="38" fill="#5E6AD2" font-weight="700"><tspan x="1587" dy="0">→</tspan></text>
<rect x="1606" y="544" width="468" height="180" rx="14" fill="#FFFFFF" stroke="#D8DEE8" stroke-width="1.4"/>
<text x="1630" y="590" font-size="24" fill="#111827" font-weight="700"><tspan x="1630" dy="0">落地</tspan></text>
<text x="1630" y="626" font-size="17" fill="#5F6B7A" font-weight="500"><tspan x="1630" dy="0">Wiki 记录原则，Skill 写执行规则。</tspan></text>
</g><g data-v43-block="decision-matrix-2" data-block-type="decision-matrix" data-x="96" data-y="800" data-width="2008" data-height="350" data-column="full" data-row="1" data-span="12" data-density="dense" data-preferred-width="2008" data-text-units="54" data-item-count="3" data-item-layout="rows" data-layout-reason="tabular-comparison">
