<text x="138" y="258" font-size="18" fill="#5E6AD2" font-weight="700"><tspan x="138" dy="0">主判断</tspan></text>
<text x="138" y="308" font-size="31" fill="#111827" font-weight="700"><tspan x="138" dy="0">原则进 Wiki，规则进 Skill，案例进文档。</tspan></text>
</g><g data-v43-block="narrative-chain-1" data-block-type="narrative-chain" data-x="96" data-y="404" data-width="2008" data-height="334" data-column="full" data-row="0" data-span="12" data-row-alignment="filled" data-offset-span="0" data-density="medium" data-preferred-width="2008" data-text-units="95" data-item-count="4" data-item-layout="rows" data-layout-reason="directional-reading">
