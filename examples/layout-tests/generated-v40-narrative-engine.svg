</g><g data-v43-block="action-list-4" data-block-type="action-list" data-x="606" data-y="1182" data-width="988" data-height="336" data-column="center" data-component-variant="action-checklist" data-row="2" data-span="6" data-row-alignment="centered" data-offset-span="3" data-density="sparse" data-preferred-width="648" data-text-units="42" data-item-count="3" data-item-layout="rows" data-layout-reason="few-short-parallel-items">
