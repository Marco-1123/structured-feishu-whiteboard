<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0 0 L10 4 L0 8 z" fill="#375DFE"/>
  </marker>
</defs>
<rect x="0" y="0" width="2200" height="1320" fill="#FDF0E0"/>
<g data-creative-renderer="riptide-cobalt">
<rect x="0" y="0" width="2200" height="1320" fill="#FDF0E0"/>
<rect x="72" y="72" width="760" height="496" rx="0" fill="#375DFE" stroke="#1A2240" stroke-width="3"/>
<rect x="112" y="122" width="170" height="44" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="2"/>
<text x="132" y="152" font-size="20" fill="#375DFE" font-weight="800"><tspan x="132" dy="0">蓝图判断</tspan></text>
<rect x="112" y="204" width="642" height="258" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="3"/>
<text x="146" y="290" font-size="56" fill="#1A2240" font-weight="900"><tspan x="146" dy="0">团队智能体协作蓝图</tspan></text>
<text x="150" y="408" font-size="22" fill="#4E5873" font-weight="500"><tspan x="150" dy="0">用强双色块表达主张，用高对比内容区保证小字可读。</tspan></text>
<rect x="72" y="608" width="760" height="198" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="3"/>
<text x="112" y="664" font-size="20" fill="#375DFE" font-weight="800"><tspan x="112" dy="0">蓝图判断</tspan></text>
<text x="112" y="724" font-size="34" fill="#1A2240" font-weight="800"><tspan x="112" dy="0">走向可控多样化，但不牺牲结构和秩序。</tspan></text>
<rect x="880" y="72" width="1248" height="734" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="3"/>
<text x="926" y="142" font-size="30" fill="#1A2240" font-weight="900"><tspan x="926" dy="0">协作蓝图</tspan></text>
<text x="928" y="180" font-size="18" fill="#4E5873" font-weight="500"><tspan x="928" dy="0">从输入到可编辑画板</tspan></text>
<rect x="928" y="238" width="238" height="302" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="2"/>
<rect x="928" y="238" width="238" height="52" rx="0" fill="#FDF0E0" stroke="#1A2240" stroke-width="1"/>
<text x="950" y="273" font-size="18" fill="#375DFE" font-weight="900"><tspan x="950" dy="0">01</tspan></text>
<text x="950" y="346" font-size="28" fill="#1A2240" font-weight="900"><tspan x="950" dy="0">统一入口</tspan></text>
<text x="950" y="428" font-size="16" fill="#4E5873" font-weight="500"><tspan x="950" dy="0">用户只提交材料和表达</tspan><tspan x="950" dy="23">目标。</tspan></text>
<line x1="1166" y1="390" x2="1204" y2="390" stroke="#375DFE" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1220" y="238" width="238" height="302" rx="0" fill="#E8ECFF" stroke="#375DFE" stroke-width="3"/>
<rect x="1220" y="238" width="238" height="52" rx="0" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="1242" y="273" font-size="18" fill="#FFFFFF" font-weight="900"><tspan x="1242" dy="0">02</tspan></text>
<text x="1242" y="346" font-size="28" fill="#1A2240" font-weight="900"><tspan x="1242" dy="0">结构化判断</tspan></text>
<text x="1242" y="428" font-size="16" fill="#4E5873" font-weight="500"><tspan x="1242" dy="0">先提炼主题、证据、</tspan><tspan x="1242" dy="23">风险和行动。</tspan></text>
<line x1="1458" y1="390" x2="1496" y2="390" stroke="#375DFE" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1512" y="238" width="238" height="302" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="2"/>
<rect x="1512" y="238" width="238" height="52" rx="0" fill="#FDF0E0" stroke="#1A2240" stroke-width="1"/>
<text x="1534" y="273" font-size="18" fill="#375DFE" font-weight="900"><tspan x="1534" dy="0">03</tspan></text>
<text x="1534" y="346" font-size="28" fill="#1A2240" font-weight="900"><tspan x="1534" dy="0">风格选择</tspan></text>
<text x="1534" y="428" font-size="16" fill="#4E5873" font-weight="500"><tspan x="1534" dy="0">默认工作型，创意风格主</tspan><tspan x="1534" dy="23">动选择。</tspan></text>
<line x1="1750" y1="390" x2="1788" y2="390" stroke="#375DFE" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="1804" y="238" width="238" height="302" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="2"/>
<rect x="1804" y="238" width="238" height="52" rx="0" fill="#FDF0E0" stroke="#1A2240" stroke-width="1"/>
<text x="1826" y="273" font-size="18" fill="#375DFE" font-weight="900"><tspan x="1826" dy="0">04</tspan></text>
<text x="1826" y="346" font-size="28" fill="#1A2240" font-weight="900"><tspan x="1826" dy="0">画板生成</tspan></text>
<text x="1826" y="428" font-size="16" fill="#4E5873" font-weight="500"><tspan x="1826" dy="0">输出可编辑 SVG</tspan><tspan x="1826" dy="23">画板并检查。</tspan></text>

<rect x="926" y="592" width="1156" height="154" rx="0" fill="#FDF0E0" stroke="#1A2240" stroke-width="2"/>
<text x="956" y="646" font-size="22" fill="#1A2240" font-weight="900"><tspan x="956" dy="0">风格选择</tspan></text>
<rect x="956" y="674" width="310" height="44" rx="0" fill="#375DFE" stroke="#1A2240" stroke-width="2"/>
<text x="974" y="703" font-size="17" fill="#FFFFFF" font-weight="800"><tspan x="974" dy="0">工作汇报</tspan></text>
<rect x="1316" y="674" width="310" height="44" rx="0" fill="#375DFE" stroke="#1A2240" stroke-width="2"/>
<text x="1334" y="703" font-size="17" fill="#FFFFFF" font-weight="800"><tspan x="1334" dy="0">数据复盘</tspan></text>
<rect x="1676" y="674" width="310" height="44" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="2"/>
<text x="1694" y="703" font-size="17" fill="#1A2240" font-weight="800"><tspan x="1694" dy="0">概念宣讲</tspan></text>
<rect x="72" y="860" width="988" height="292" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="3"/>
<text x="100" y="908" font-size="24" fill="#1A2240" font-weight="700"><tspan x="100" dy="0">设计边界</tspan></text>
<text x="100" y="942" font-size="17" fill="#4E5873" font-weight="400"><tspan x="100" dy="0">强视觉不能破坏可读性</tspan></text>
<rect x="100" y="960" width="301" height="136" rx="10" fill="#FDF0E0" stroke="#1A2240" stroke-width="1.2"/>
<rect x="100" y="960" width="6" height="136" rx="3" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="118" y="989" font-size="17" fill="#375DFE" font-weight="700"><tspan x="118" dy="0">小字直接压在强色块</tspan></text>

<rect x="415" y="960" width="301" height="136" rx="10" fill="#FDF0E0" stroke="#1A2240" stroke-width="1.2"/>
<rect x="415" y="960" width="6" height="136" rx="3" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="433" y="989" font-size="17" fill="#375DFE" font-weight="700"><tspan x="433" dy="0">颜色承担多重含义</tspan></text>

<rect x="730" y="960" width="301" height="136" rx="10" fill="#FDF0E0" stroke="#1A2240" stroke-width="1.2"/>
<rect x="730" y="960" width="6" height="136" rx="3" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="748" y="989" font-size="17" fill="#375DFE" font-weight="700"><tspan x="748" dy="0">卡片排列失去秩序</tspan></text>

<rect x="1108" y="860" width="1020" height="292" rx="0" fill="#FFFFFF" stroke="#1A2240" stroke-width="3"/>
<text x="1136" y="908" font-size="24" fill="#1A2240" font-weight="700"><tspan x="1136" dy="0">落地动作</tspan></text>
<text x="1136" y="942" font-size="17" fill="#4E5873" font-weight="400"><tspan x="1136" dy="0">先验证，再发布</tspan></text>
<rect x="1136" y="960" width="312" height="136" rx="10" fill="#FDF0E0" stroke="#1A2240" stroke-width="1.2"/>
<rect x="1136" y="960" width="6" height="136" rx="3" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="1154" y="989" font-size="17" fill="#1A2240" font-weight="700"><tspan x="1154" dy="0">生成样例图</tspan></text>

<rect x="1462" y="960" width="312" height="136" rx="10" fill="#FDF0E0" stroke="#1A2240" stroke-width="1.2"/>
<rect x="1462" y="960" width="6" height="136" rx="3" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="1480" y="989" font-size="17" fill="#1A2240" font-weight="700"><tspan x="1480" dy="0">检查内容层级</tspan></text>

<rect x="1788" y="960" width="312" height="136" rx="10" fill="#FDF0E0" stroke="#1A2240" stroke-width="1.2"/>
<rect x="1788" y="960" width="6" height="136" rx="3" fill="#375DFE" stroke="#375DFE" stroke-width="1"/>
<text x="1806" y="989" font-size="17" fill="#1A2240" font-weight="700"><tspan x="1806" dy="0">飞书预览复核</tspan></text>

<text x="72" y="1234" font-size="24" fill="#4E5873" font-weight="600"><tspan x="72" dy="0">适合概念蓝图、宣讲页和战略主张，不作为默认自动风格。</tspan></text>
</g>
</svg>
